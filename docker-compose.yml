services:
  postgres:
    image: postgres:15-alpine
    container_name: carspot_db
    environment:
      POSTGRES_USER: carspot_user
      POSTGRES_PASSWORD: carspot_password
      POSTGRES_DB: carspot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carspot_user -d carspot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carspot_api
    environment:
      DATABASE_URL: postgresql://carspot_user:carspot_password@postgres:5432/carspot_db
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: