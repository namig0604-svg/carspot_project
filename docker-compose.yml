services:
  db:
    image: postgres:16-alpine
    container_name: carspot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carspot_db
    ports:
      - "5432:5432"
    volumes:
      - carspot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: carspot_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/carspot_db
      SECRET_KEY: local-dev-secret-key
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  carspot_pgdata:
